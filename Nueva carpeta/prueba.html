<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prueba FBX - Alien</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    background: #050505;
    color: white;

    font-family: Arial, sans-serif;
}

h1 {
    text-align: center;
    margin: 30px 0 10px;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 30px;
}

.container {

    width: 95%;
    max-width: 1400px;

    margin: auto;

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 20px;
}

.card {

    background: #101010;

    border:
        1px solid #252525;

    border-radius: 20px;

    padding: 15px;

    text-align: center;
}

.card h2 {

    margin: 5px 0 10px;

    font-size: 18px;
}

.model {

    position: relative;

    width: 100%;

    aspect-ratio: 1 / 1;

    background: #000;

    border-radius: 15px;

    overflow: hidden;
}

.model canvas {

    width: 100% !important;
    height: 100% !important;

    display: block;
}

.status {

    margin-top: 10px;

    color: #777;

    font-size: 13px;

    min-height: 20px;
}

@media(max-width: 800px) {

    .container {

        grid-template-columns: 1fr;

    }

}

</style>

</head>

<body>


<h1>PRUEBA DE MODELOS FBX</h1>

<div class="subtitle">
    alien1.fbx · alien2.fbx · alien3.fbx
</div>


<div class="container">

    <div class="card">

        <h2>ALIEN 1</h2>

        <div
            id="model1"
            class="model"
        ></div>

        >

        </div>

    </div>


    <!-- ALIEN 2 -->

    <div class="card">

        <h2>ALIEN 2</h2>

        <div
            id="model2"
            class="model"
        ></div>

        <div
            id="status2"
            class="status"
        >
            Cargando...
        </div>

    </div>


    <!-- ALIEN 3 -->

    <div class="card">

        <h2>ALIEN 3</h2>

        <div
            id="model3"
            class="model"
        ></div>

        <div
            id="status3"
            class="status"
        >
            Cargando...
        </div>

    </div>


</div>


<script type="importmap">

{
    "imports": {

        "three":
            "https://unpkg.com/three@0.160.0/build/three.module.js",

        "three/addons/":
            "https://unpkg.com/three@0.160.0/examples/jsm/"

    }
}

</script>


<script type="module">

import * as THREE from "three";

import { FBXLoader }
from "three/addons/loaders/FBXLoader.js";

import { RoomEnvironment }
from "three/addons/environments/RoomEnvironment.js";


/* =====================================================
   CONFIGURACIÓN
===================================================== */

const modelos = [

    {
        archivo: "Mascotas/alien1.fbx",
        contenedor: "model1",
        estado: "status1"
    },

    {
        archivo: "Mascotas/alien2.fbx",
        contenedor: "model2",
        estado: "status2"
    },

    {
        archivo: "Mascotas/alien3.fbx",
        contenedor: "model3",
        estado: "status3"
    }

];


const escenas = [];


/* =====================================================
   CREAR MODELO
===================================================== */

function crearModelo(datos) {

    const container =
        document.getElementById(
            datos.contenedor
        );

    const status =
        document.getElementById(
            datos.estado
        );


    /* -------------------------------------------------
       ESCENA
    ------------------------------------------------- */

    const scene =
        new THREE.Scene();


    /* -------------------------------------------------
       CÁMARA
    ------------------------------------------------- */

    const camera =
        new THREE.PerspectiveCamera(
            35,
            1,
            0.1,
            1000
        );


    camera.position.set(
        0,
        1.5,
        4
    );


    /* -------------------------------------------------
       RENDERER
    ------------------------------------------------- */

    const renderer =
        new THREE.WebGLRenderer({

            antialias: true,

            alpha: true

        });


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );


    renderer.outputColorSpace =
        THREE.SRGBColorSpace;


    renderer.toneMapping =
        THREE.ACESFilmicToneMapping;


    renderer.toneMappingExposure =
        1.3;


    container.appendChild(
        renderer.domElement
    );


    /* -------------------------------------------------
       AMBIENTE
    ------------------------------------------------- */

    const pmrem =
        new THREE.PMREMGenerator(
            renderer
        );


    scene.environment =
        pmrem.fromScene(
            new RoomEnvironment(),
            0.04
        ).texture;


    /* -------------------------------------------------
       LUCES
    ------------------------------------------------- */

    const hemi =
        new THREE.HemisphereLight(
            0xffffff,
            0x222222,
            2
        );

    scene.add(hemi);


    const key =
        new THREE.DirectionalLight(
            0xffffff,
            3
        );


    key.position.set(
        3,
        5,
        4
    );


    scene.add(key);


    const fill =
        new THREE.DirectionalLight(
            0xffffff,
            1.5
        );


    fill.position.set(
        -3,
        2,
        -2
    );


    scene.add(fill);


    /* -------------------------------------------------
       RELOJ / ANIMACIÓN
    ------------------------------------------------- */

    const clock =
        new THREE.Clock();


    let mixer = null;

    let model = null;


    /* -------------------------------------------------
       REDIMENSIONAR
    ------------------------------------------------- */

    function resize() {

        const width =
            container.clientWidth;

        const height =
            container.clientHeight;


        if(width === 0 || height === 0)
            return;


        renderer.setSize(
            width,
            height
        );


        camera.aspect =
            width / height;


        camera.updateProjectionMatrix();

    }


    resize();


    window.addEventListener(
        "resize",
        resize
    );


    /* -------------------------------------------------
       CARGAR FBX
    ------------------------------------------------- */

    const loader =
        new FBXLoader();


    console.log(
        "Intentando cargar:",
        datos.archivo
    );


    loader.load(

        datos.archivo,


        /* =========================================
           FBX CARGADO
        ========================================= */

        function(object) {

            console.log(
                "FBX cargado correctamente:",
                datos.archivo
            );


            model = object;


            /* -----------------------------------------
               CALCULAR TAMAÑO
            ----------------------------------------- */

            const box =
                new THREE.Box3()
                    .setFromObject(model);


            const size =
                box.getSize(
                    new THREE.Vector3()
                );


            const maxDimension =
                Math.max(
                    size.x,
                    size.y,
                    size.z
                );


            /* -----------------------------------------
               ESCALA
            ----------------------------------------- */

            if(maxDimension > 0) {

                const escala =
                    2.2 / maxDimension;

                model.scale.setScalar(
                    escala
                );

            }


            /* -----------------------------------------
               CENTRAR MODELO
            ----------------------------------------- */

            const box2 =
                new THREE.Box3()
                    .setFromObject(model);


            const center =
                box2.getCenter(
                    new THREE.Vector3()
                );


            model.position.x -=
                center.x;


            model.position.z -=
                center.z;


            model.position.y -=
                box2.min.y;


            /* -----------------------------------------
               MATERIALES
            ----------------------------------------- */

            model.traverse(
                function(child) {

                    if(!child.isMesh)
                        return;


                    child.castShadow = true;

                    child.receiveShadow = true;


                    const materiales =
                        Array.isArray(
                            child.material
                        )
                            ? child.material
                            : [child.material];


                    materiales.forEach(
                        function(material) {

                            if(!material)
                                return;


                            if(material.map) {

                                material.map.colorSpace =
                                    THREE.SRGBColorSpace;

                                material.map.needsUpdate =
                                    true;

                            }


                            if(
                                "roughness"
                                in material
                            ) {

                                material.roughness =
                                    0.7;

                            }


                            if(
                                "metalness"
                                in material
                            ) {

                                material.metalness =
                                    0.1;

                            }


                            material.needsUpdate =
                                true;

                        }
                    );

                }
            );


            /* -----------------------------------------
               AGREGAR ESCENA
            ----------------------------------------- */

            scene.add(
                model
            );


            /* -----------------------------------------
               ANIMACIÓN
            ----------------------------------------- */

            if(
                model.animations &&
                model.animations.length > 0
            ) {

                console.log(
                    datos.archivo,
                    "tiene",
                    model.animations.length,
                    "animación(es)"
                );


                console.log(
                    model.animations
                );


                mixer =
                    new THREE.AnimationMixer(
                        model
                    );


                const action =
                    mixer.clipAction(
                        model.animations[0]
                    );


                action.play();


                status.textContent =
                    "✓ Modelo + animación cargados";

            }

            else {

                console.log(
                    datos.archivo,
                    "NO contiene animaciones"
                );


                status.textContent =
                    "✓ Modelo cargado · sin animación";

            }


            escenas.push({
                clock,
                mixer
            });

        },


        /* =========================================
           PROGRESO
        ========================================= */

        function(xhr) {

            if(xhr.total) {

                const porcentaje =
                    (
                        xhr.loaded /
                        xhr.total
                    ) * 100;


                status.textContent =
                    `Cargando... ${porcentaje.toFixed(0)}%`;

            }

        },


        /* =========================================
           ERROR
        ========================================= */

        function(error) {

            console.error(
                "================================"
            );


            console.error(
                "ERROR CARGANDO FBX"
            );


            console.error(
                "Archivo:",
                datos.archivo
            );


            console.error(
                error
            );


            console.error(
                "================================"
            );


            status.textContent =
                "❌ No se pudo cargar";

        }

    );


    /* -------------------------------------------------
       LOOP
    ------------------------------------------------- */

    function animate() {

        requestAnimationFrame(
            animate
        );


        const delta =
            clock.getDelta();


        if(mixer) {

            mixer.update(
                delta
            );

        }


        if(model) {

            model.rotation.y +=
                delta * 0.25;

        }


        renderer.render(
            scene,
            camera
        );

    }


    animate();

}


/* =====================================================
   CARGAR LOS 3
===================================================== */

modelos.forEach(
    crearModelo
);

</script>

</body>

</html>
