<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ROBOT LAB | Iniciar sesión</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(0, 255, 255, 0.10),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 80% 80%,
                    rgba(170, 0, 255, 0.10),
                    transparent 30%
                ),

                #050509;

            color: white;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            display: flex;

            justify-content: center;

            align-items: center;

            overflow: hidden;
        }


        body::before {

            content: "";

            position: fixed;

            inset: 0;

            background-image:

                linear-gradient(
                    rgba(0,255,255,0.025) 1px,
                    transparent 1px
                ),

                linear-gradient(
                    90deg,
                    rgba(0,255,255,0.025) 1px,
                    transparent 1px
                );

            background-size: 40px 40px;

            pointer-events: none;
        }


        .login-container {

            width: 100%;

            max-width: 450px;

            padding: 25px;

            position: relative;

            z-index: 2;
        }


        .login-box {

            background:
                rgba(10, 10, 18, 0.92);

            border:
                1px solid
                rgba(0, 255, 255, 0.35);

            border-radius: 24px;

            padding: 45px 40px;

            box-shadow:

                0 0 30px
                rgba(0, 255, 255, 0.10),

                0 0 80px
                rgba(140, 0, 255, 0.08);

            backdrop-filter: blur(15px);
        }


        /* LOGO */

        .logo {

            text-align: center;

            margin-bottom: 35px;
        }


        .robot-icon {

            font-size: 65px;

            margin-bottom: 10px;

            filter:
                drop-shadow(
                    0 0 10px
                    rgba(0,255,255,0.8)
                );
        }


        .logo h1 {

            font-size: 28px;

            letter-spacing: 5px;

            color: #00ffff;

            text-shadow:
                0 0 10px
                rgba(0,255,255,0.8);
        }


        .logo p {

            margin-top: 8px;

            font-size: 12px;

            letter-spacing: 3px;

            color: #888;
        }


        /* BIENVENIDA */

        .welcome {

            text-align: center;

            margin-bottom: 30px;
        }


        .welcome h2 {

            font-size: 22px;

            margin-bottom: 8px;
        }


        .welcome p {

            color: #888;

            font-size: 14px;
        }


        /* INPUTS */

        .input-group {

            margin-bottom: 20px;
        }


        .input-group label {

            display: block;

            margin-bottom: 8px;

            font-size: 12px;

            font-weight: bold;

            color: #aaa;

            letter-spacing: 1px;
        }


        .input-group input {

            width: 100%;

            padding: 15px 16px;

            border-radius: 12px;

            border:
                1px solid
                rgba(0,255,255,0.25);

            background: #08080d;

            color: white;

            font-size: 15px;

            outline: none;

            transition: 0.25s;
        }


        .input-group input:focus {

            border-color: #00ffff;

            box-shadow:
                0 0 15px
                rgba(0,255,255,0.15);
        }


        .input-group input::placeholder {

            color: #555;
        }


        /* BOTÓN */

        .login-button {

            width: 100%;

            padding: 16px;

            margin-top: 5px;

            border: none;

            border-radius: 12px;

            background:
                linear-gradient(
                    90deg,
                    #00ffff,
                    #7b2cff
                );

            color: white;

            font-size: 14px;

            font-weight: bold;

            letter-spacing: 2px;

            cursor: pointer;

            transition: 0.25s;

            box-shadow:
                0 0 20px
                rgba(0,255,255,0.15);
        }


        .login-button:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 0 30px
                rgba(0,255,255,0.30);
        }


        .login-button:disabled {

            opacity: 0.6;

            cursor: wait;

            transform: none;
        }


        /* MENSAJE */

        .mensaje {

            display: none;

            margin-top: 20px;

            padding: 12px;

            border-radius: 10px;

            text-align: center;

            font-size: 13px;

            line-height: 1.5;
        }


        .error {

            background:
                rgba(255,40,70,0.10);

            border:
                1px solid
                rgba(255,40,70,0.40);

            color: #ff6075;
        }


        .exito {

            background:
                rgba(0,255,150,0.08);

            border:
                1px solid
                rgba(0,255,150,0.30);

            color: #00ff9d;
        }


        /* FOOTER */

        .footer {

            text-align: center;

            margin-top: 30px;

            color: #555;

            font-size: 11px;

            letter-spacing: 1px;
        }


        /* RESPONSIVE */

        @media (max-width: 500px) {

            .login-container {

                padding: 18px;
            }


            .login-box {

                padding: 35px 25px;
            }


            .logo h1 {

                font-size: 24px;
            }


            .robot-icon {

                font-size: 55px;
            }

        }

    </style>

</head>


<body>


    <div class="login-container">

        <div class="login-box">


            <!-- LOGO -->

            <div class="logo">

                <div class="robot-icon">
                    🤖
                </div>

                <h1>
                    ROBOT LAB
                </h1>

                <p>
                    CAMPUS VIRTUAL
                </p>

            </div>


            <!-- BIENVENIDA -->

            <div class="welcome">

                <h2>
                    ¡Bienvenido!
                </h2>

                <p>
                    Ingresa para continuar tu aventura tecnológica.
                </p>

            </div>


            <!-- FORMULARIO -->

            <form id="loginForm">


                <div class="input-group">

                    <label for="usuario">
                        USUARIO
                    </label>

                    <input
                        type="text"
                        id="usuario"
                        placeholder="Escribe tu usuario"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="password">
                        CONTRASEÑA
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Escribe tu contraseña"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    id="loginButton"
                    class="login-button"
                >

                    🚀 ENTRAR AL CAMPUS

                </button>


            </form>


            <!-- ERROR -->

            <div
                id="error"
                class="mensaje error"
            ></div>


            <!-- ÉXITO -->

            <div
                id="exito"
                class="mensaje exito"
            >

                ✅ Acceso correcto. Entrando al campus...

            </div>


            <!-- FOOTER -->

            <div class="footer">

                ROBOT LAB © 2026

            </div>


        </div>

    </div>



    <!-- =========================================
         SUPABASE
    ========================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>


        // =========================================
        // SUPABASE
        // =========================================

        const SUPABASE_URL =
            "https://bcfknbpkduiwgqymxkns.supabase.co";


        const SUPABASE_KEY =
            "sb_publishable_END5KZ8gA4e9YDpicG-aLw_aRaIzo7E";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );



        // =========================================
        // ELEMENTOS
        // =========================================

        const loginForm =
            document.getElementById("loginForm");


        const usuarioInput =
            document.getElementById("usuario");


        const passwordInput =
            document.getElementById("password");


        const loginButton =
            document.getElementById("loginButton");


        const error =
            document.getElementById("error");


        const exito =
            document.getElementById("exito");



        // =========================================
        // MOSTRAR ERROR
        // =========================================

        function mostrarError(texto) {

            error.textContent =
                "❌ " + texto;

            error.style.display =
                "block";

            exito.style.display =
                "none";

            loginButton.disabled =
                false;

            loginButton.textContent =
                "🚀 ENTRAR AL CAMPUS";
        }



        // =========================================
        // LOGIN
        // =========================================

        loginForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                error.style.display =
                    "none";


                exito.style.display =
                    "none";


                const usuario =
                    usuarioInput.value
                        .trim()
                        .toLowerCase();


                const password =
                    passwordInput.value;


                // =====================================
                // VALIDACIÓN BÁSICA
                // =====================================

                if (!usuario || !password) {

                    mostrarError(
                        "Escribe tu usuario y contraseña."
                    );

                    return;
                }


                // =====================================
                // BLOQUEAR BOTÓN
                // =====================================

                loginButton.disabled =
                    true;

                loginButton.textContent =
                    "⏳ INICIANDO...";


                try {


                    // =================================
                    // CREAR EMAIL INTERNO
                    // =================================

                    const email =
                        usuario +
                        "@citzapopan.com";


                    console.log(
                        "Intentando login:",
                        email
                    );


                    // =================================
                    // AUTENTICAR
                    // =================================

                    const {
                        data: authData,
                        error: authError
                    } =
                        await supabaseClient.auth
                            .signInWithPassword({

                                email: email,

                                password: password

                            });


                    // =================================
                    // ERROR AUTH
                    // =================================

                    if (authError) {

                        console.error(
                            "Supabase Auth:",
                            authError
                        );


                        mostrarError(
                            "Usuario o contraseña incorrectos."
                        );

                        return;
                    }


                    // =================================
                    // VERIFICAR USUARIO
                    // =================================

                    if (
                        !authData ||
                        !authData.user
                    ) {

                        mostrarError(
                            "No se pudo identificar al usuario."
                        );

                        return;
                    }


                    console.log(
                        "UID:",
                        authData.user.id
                    );


                    // =================================
                    // BUSCAR ALUMNO
                    // =================================

                    const {
                        data: alumno,
                        error: alumnoError
                    } =
                        await supabaseClient

                            .from("alumnos")

                            .select(
                                "id, usuario, nombre, mascota, puntos, nivel, energia"
                            )

                            .eq(
                                "auth_id",
                                authData.user.id
                            )

                            .maybeSingle();


                    // =================================
                    // ERROR BASE DE DATOS
                    // =================================

                    if (alumnoError) {

                        console.error(
                            "Error alumnos:",
                            alumnoError
                        );


                        await supabaseClient.auth
                            .signOut();


                        mostrarError(
                            "No se pudo consultar tu perfil."
                        );

                        return;
                    }


                    // =================================
                    // ALUMNO NO ENCONTRADO
                    // =================================

                    if (!alumno) {

                        await supabaseClient.auth
                            .signOut();


                        mostrarError(
                            "Tu cuenta existe, pero no está vinculada a un alumno."
                        );

                        return;
                    }


                    console.log(
                        "Alumno:",
                        alumno
                    );


                    // =================================
                    // GUARDAR INFORMACIÓN DE SESIÓN
                    // =================================

                    sessionStorage.setItem(
                        "usuarioActivo",
                        alumno.usuario
                    );


                    sessionStorage.setItem(
                        "alumnoId",
                        alumno.id
                    );


                    // =================================
                    // LOGIN CORRECTO
                    // =================================

                    exito.style.display =
                        "block";


                    loginButton.textContent =
                        "✅ ACCESO CORRECTO";


                    // =================================
                    // DECIDIR DESTINO
                    // =================================

                    setTimeout(
                        function() {


                            if (
                                alumno.mascota !== null &&
                                alumno.mascota !== ""
                            ) {

                                console.log(
                                    "Mascota encontrada:",
                                    alumno.mascota
                                );


                                window.location.href =
                                    "index.html";

                            }

                            else {

                                console.log(
                                    "Alumno sin mascota."
                                );


                                window.location.href =
                                    "elegir-mascota.html";

                            }

                        },
                        700
                    );

                }


                catch (problema) {

                    console.error(
                        "Error inesperado:",
                        problema
                    );


                    mostrarError(
                        "No se pudo conectar con el sistema."
                    );

                }

            }
        );

    </script>


</body>

</html>
