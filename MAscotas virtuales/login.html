<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


body {

    min-height: 100vh;

    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(0,255,255,0.10),
            transparent 30%
        ),

        radial-gradient(
            circle at 80% 80%,
            rgba(170,0,255,0.10),
            transparent 30%
        ),

        #050509;

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    display: flex;

    justify-content: center;

    align-items: center;

    overflow: hidden;
}


body::before {

    content: "";

    position: fixed;

    inset: 0;

    background-image:

        linear-gradient(
            rgba(0,255,255,0.025) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(0,255,255,0.025) 1px,
            transparent 1px
        );

    background-size: 40px 40px;

    pointer-events: none;
}


.login-container {

    width: 100%;

    max-width: 450px;

    padding: 25px;

    position: relative;

    z-index: 2;
}


.login-box {

    background:
        rgba(10,10,18,0.92);

    border:
        1px solid
        rgba(0,255,255,0.35);

    border-radius: 24px;

    padding: 45px 40px;

    box-shadow:

        0 0 30px
        rgba(0,255,255,0.10),

        0 0 80px
        rgba(140,0,255,0.08);

    backdrop-filter: blur(15px);
}


.logo {

    text-align: center;

    margin-bottom: 35px;
}


.robot-icon {

    font-size: 65px;

    margin-bottom: 10px;

    filter:
        drop-shadow(
            0 0 10px
            rgba(0,255,255,0.8)
        );
}


.logo h1 {

    font-size: 28px;

    letter-spacing: 5px;

    color: #00ffff;

    text-shadow:
        0 0 10px
        rgba(0,255,255,0.8);
}


.logo p {

    margin-top: 8px;

    font-size: 12px;

    letter-spacing: 3px;

    color: #888;
}


.welcome {

    text-align: center;

    margin-bottom: 30px;
}


.welcome h2 {

    font-size: 22px;

    margin-bottom: 8px;
}


.welcome p {

    color: #888;

    font-size: 14px;
}


.input-group {

    margin-bottom: 20px;
}


.input-group label {

    display: block;

    margin-bottom: 8px;

    font-size: 12px;

    font-weight: bold;

    color: #aaa;

    letter-spacing: 1px;
}


.input-group input {

    width: 100%;

    padding: 15px 16px;

    border-radius: 12px;

    border:
        1px solid
        rgba(0,255,255,0.25);

    background: #08080d;

    color: white;

    font-size: 15px;

    outline: none;

    transition: 0.25s;
}


.input-group input:focus {

    border-color: #00ffff;

    box-shadow:
        0 0 15px
        rgba(0,255,255,0.15);
}


.input-group input::placeholder {

    color: #555;
}


.login-button {

    width: 100%;

    padding: 16px;

    margin-top: 5px;

    border: none;

    border-radius: 12px;

    background:
        linear-gradient(
            90deg,
            #00ffff,
            #7b2cff
        );

    color: white;

    font-size: 14px;

    font-weight: bold;

    letter-spacing: 2px;

    cursor: pointer;

    transition: 0.25s;

    box-shadow:
        0 0 20px
        rgba(0,255,255,0.15);
}


.login-button:hover {

    transform:
        translateY(-2px);

    box-shadow:
        0 0 30px
        rgba(0,255,255,0.30);
}


.login-button:disabled {

    opacity: 0.6;

    transform: none;
}

    display: none;

}


.success {

    display: none;

    margin-top: 20px;

    padding: 12px;

    background:

    border:

    text-align: center;

}


.footer {

    text-align: center;

    margin-top: 30px;

    color: #555;

    font-size: 11px;

    letter-spacing: 1px;
}


@media (max-width:500px) {

    .login-container {

        padding: 18px;
    }

    .login-box {

        padding: 35px 25px;
    }

    .logo h1 {

        font-size: 24px;

    .robot-icon {

        font-size: 55px;
    }

}

</style>

</head>


<body>


<div class="login-container">

<div class="login-box">


    <!-- LOGO -->

    <div class="logo">

        <div class="robot-icon">
            🤖
        </div>

        <h1>
            ROBOT LAB
        </h1>

        <p>
            CAMPUS VIRTUAL
        </p>

    </div>


    <!-- BIENVENIDA -->

    <div class="welcome">

        <h2>
            ¡Bienvenido!
        </h2>

        <p>
            Ingresa para continuar tu aventura tecnológica.
        </p>

    </div>


    <!-- LOGIN -->

    <form id="loginForm">


        <div class="input-group">

            <label for="usuario">
                USUARIO

            <input
                type="text"
                id="usuario"
                placeholder="Escribe tu usuario"
                autocomplete="username"
                required
            >

        </div>

            <label for="password">
                CONTRASEÑA

            <input

                id="password"

                required
            >

        </div>


        <button
            type="submit"
            class="login-button"
            id="loginButton"
        >

            🚀 ENTRAR AL CAMPUS

        </button>

    </form>


    <!-- ERROR -->

    <div
        id="error"
        class="error"
    ></div>


    <!-- ÉXITO -->

    <div
        id="success"
        class="success"
    >

        ✅ Acceso correcto. Entrando al campus...

    </div>


    <div class="footer">

        ROBOT LAB © 2026

    </div>


</div>

<!-- =========================================
     SUPABASE
========================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

console.log("ROBOT LAB: iniciando sistema...");


// =========================================
// CONFIGURACIÓN SUPABASE
// =========================================

const SUPABASE_URL =
    "https://bcfknbpkduiwgqymxkns.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_END5KZ8gA4e9YDpicG-aLw_aRaIzo7E";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


console.log("ROBOT LAB: Supabase conectado.");


// =========================================
// ELEMENTOS
// =========================================

const loginForm =
    document.getElementById("loginForm");

const usuarioInput =
    document.getElementById("usuario");

const passwordInput =
    document.getElementById("password");

const loginButton =
    document.getElementById("loginButton");

const error =
    document.getElementById("error");

const success =
    document.getElementById("success");


// =========================================
// MOSTRAR ERROR
// =========================================

function mostrarError(mensaje) {

    error.textContent =
        "❌ " + mensaje;

    error.style.display =
        "block";

    success.style.display =
        "none";

    loginButton.disabled =
        false;

    loginButton.textContent =
        "🚀 ENTRAR AL CAMPUS";
}


// =========================================
// LOGIN
// =========================================

loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        console.log(
            "Intentando iniciar sesión..."
        );


        error.style.display =
            "none";


        success.style.display =
            "none";


        const usuario =
            usuarioInput.value
                .trim()
                .toLowerCase();


        const password =
            passwordInput.value;


        if (!usuario || !password) {

            mostrarError(
                "Escribe tu usuario y contraseña."
            );

            return;
        }


        // =====================================
        // BOTÓN
        // =====================================

        loginButton.disabled =
            true;

        loginButton.textContent =
            "⏳ INICIANDO...";


        // =====================================
        // EMAIL INTERNO
        // =====================================

        const email =
            usuario + "@citzapopan.com";


        console.log(
            "Usuario:",
            usuario
        );


        console.log(
            "Email utilizado:",
            email
        );


        // =====================================
        // SUPABASE AUTH
        // =====================================

        try {

            const {
                data,
                error: loginError
            } =
                await supabaseClient.auth
                    .signInWithPassword({

                        email: email,

                        password: password

                    });


            console.log(
                "Respuesta Supabase:",
                data,
                loginError
            );


            // =================================
            // ERROR DE LOGIN
            // =================================

            if (loginError) {

                console.error(
                    "Error Supabase:",
                    loginError
                );


                mostrarError(
                    "Usuario o contraseña incorrectos."
                );

                return;
            }


            // =================================
            // USUARIO AUTENTICADO
            // =================================

            if (!data.user) {

                mostrarError(
                    "Supabase no devolvió el usuario."
                );

                return;
            }


            console.log(
                "Usuario autenticado:",
                data.user.id
            );


            // =================================
            // BUSCAR ALUMNO
            // =================================

            const {
                data: alumno,
                error: alumnoError
            } =
                await supabaseClient
                    .from("alumnos")
                    .select("*")
                    .eq(
                        "auth_id",
                        data.user.id
                    )
                    .maybeSingle();


            console.log(
                "Alumno encontrado:",
                alumno,
                alumnoError
            );


            // =================================
            // ERROR AL BUSCAR PERFIL
            // =================================

            if (alumnoError) {

                console.error(
                    "Error tabla alumnos:",
                    alumnoError
                );


                await supabaseClient.auth
                    .signOut();


                mostrarError(
                    "No se pudo consultar el perfil del alumno."
                );

                return;
            }


            // =================================
            // NO EXISTE PERFIL
            // =================================

            if (!alumno) {

                await supabaseClient.auth
                    .signOut();


                mostrarError(
                    "El usuario existe, pero todavía no tiene un perfil de alumno."
                );

                return;
            }


            // =================================
            // GUARDAR SESIÓN
            // =================================

            sessionStorage.setItem(
                "usuarioActivo",
                alumno.usuario
            );


            sessionStorage.setItem(
                "alumnoId",
                alumno.id
            );


            // =================================
            // MOSTRAR ÉXITO
            // =================================

            success.style.display =
                "block";


            loginButton.textContent =
                "✅ ACCESO CORRECTO";


            console.log(
                "Login correcto."
            );


            // =================================
            // REVISAR MASCOTA
            // =================================

            setTimeout(
                function() {

                    if (alumno.mascota) {

                        console.log(
                            "Mascota encontrada:",
                            alumno.mascota
                        );


                        window.location.href =
                            "index.html";

                    }

                    else {

                        console.log(
                            "Alumno sin mascota."
                        );


                        window.location.href =
                            "elegir-mascota.html";

                    }

                },
                500
            );

        }


        catch (e) {

            console.error(
                "Error inesperado:",
                e
            );


            mostrarError(
                "Ocurrió un error al conectar con el sistema."
            );

        }

    }
);

</script>


</body>

</html>
