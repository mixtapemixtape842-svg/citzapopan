<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ROBOT LAB | Iniciar sesión</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            min-height: 100vh;

            background:

                radial-gradient(
                    circle at 20% 20%,
                    rgba(0, 255, 255, 0.10),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 80% 80%,
                    rgba(170, 0, 255, 0.10),
                    transparent 30%
                ),

                #050509;

            color: white;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            display: flex;

            justify-content: center;

            align-items: center;

            overflow: hidden;
        }


        /* =========================================
           FONDO DECORATIVO
        ========================================= */

        body::before {

            content: "";

            position: fixed;

            inset: 0;

            background-image:

                linear-gradient(
                    rgba(0,255,255,0.025) 1px,
                    transparent 1px
                ),

                linear-gradient(
                    90deg,
                    rgba(0,255,255,0.025) 1px,
                    transparent 1px
                );

            background-size: 40px 40px;

            pointer-events: none;
        }


        /* =========================================
           CONTENEDOR
        ========================================= */

        .login-container {

            width: 100%;

            max-width: 450px;

            padding: 25px;

            position: relative;

            z-index: 2;
        }


        .login-box {

            background:
                rgba(10, 10, 18, 0.92);

            border:
                1px solid
                rgba(0, 255, 255, 0.35);

            border-radius: 24px;

            padding: 45px 40px;

            box-shadow:

                0 0 30px
                rgba(0, 255, 255, 0.10),

                0 0 80px
                rgba(140, 0, 255, 0.08);

            backdrop-filter: blur(15px);
        }


        /* =========================================
           LOGO
        ========================================= */

        .logo {

            text-align: center;

            margin-bottom: 35px;
        }


        .robot-icon {

            font-size: 65px;

            margin-bottom: 10px;

            filter:
                drop-shadow(
                    0 0 10px
                    rgba(0,255,255,0.8)
                );
        }


        .logo h1 {

            font-size: 28px;

            letter-spacing: 5px;

            color: #00ffff;

            text-shadow:
                0 0 10px
                rgba(0,255,255,0.8);
        }


        .logo p {

            margin-top: 8px;

            font-size: 12px;

            letter-spacing: 3px;

            color: #888;
        }


        /* =========================================
           BIENVENIDA
        ========================================= */

        .welcome {

            text-align: center;

            margin-bottom: 30px;
        }


        .welcome h2 {

            font-size: 22px;

            margin-bottom: 8px;
        }


        .welcome p {

            color: #888;

            font-size: 14px;
        }


        /* =========================================
           FORMULARIOS
        ========================================= */

        .input-group {

            margin-bottom: 20px;
        }


        .input-group label {

            display: block;

            margin-bottom: 8px;

            font-size: 12px;

            font-weight: bold;

            color: #aaa;

            letter-spacing: 1px;
        }


        .input-group input {

            width: 100%;

            padding: 15px 16px;

            border-radius: 12px;

            border:
                1px solid
                rgba(0,255,255,0.25);

            background: #08080d;

            color: white;

            font-size: 15px;

            outline: none;

            transition: 0.25s;
        }


        .input-group input:focus {

            border-color: #00ffff;

            box-shadow:
                0 0 15px
                rgba(0,255,255,0.15);
        }


        .input-group input::placeholder {

            color: #555;
        }


        /* =========================================
           BOTÓN
        ========================================= */

        .login-button {

            width: 100%;

            padding: 16px;

            margin-top: 5px;

            border: none;

            border-radius: 12px;

            background:
                linear-gradient(
                    90deg,
                    #00ffff,
                    #7b2cff
                );

            color: white;

            font-size: 14px;

            font-weight: bold;

            letter-spacing: 2px;

            cursor: pointer;

            transition: 0.25s;

            box-shadow:
                0 0 20px
                rgba(0,255,255,0.15);
        }


        .login-button:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 0 30px
                rgba(0,255,255,0.30);
        }


        .login-button:active {

            transform:
                translateY(0);
        }


        /* =========================================
           ERROR
        ========================================= */

        .error {

            display: none;

            margin-top: 20px;

            padding: 12px;

            border-radius: 10px;

            background:
                rgba(255, 40, 70, 0.10);

            border:
                1px solid
                rgba(255, 40, 70, 0.40);

            color: #ff6075;

            text-align: center;

            font-size: 13px;
        }


        /* =========================================
           FOOTER
        ========================================= */

        .footer {

            text-align: center;

            margin-top: 30px;

            color: #555;

            font-size: 11px;

            letter-spacing: 1px;
        }


        /* =========================================
           RESPONSIVE
        ========================================= */

        @media (max-width: 500px) {

            .login-container {

                padding: 18px;
            }


            .login-box {

                padding: 35px 25px;
            }


            .logo h1 {

                font-size: 24px;
            }


            .robot-icon {

                font-size: 55px;
            }

        }

    </style>

</head>


<body>


    <div class="login-container">

        <div class="login-box">


            <!-- =================================
                 LOGO
            ================================== -->

            <div class="logo">

                <div class="robot-icon">
                    🤖
                </div>

                <h1>
                    ROBOT LAB
                </h1>

                <p>
                    CAMPUS VIRTUAL
                </p>

            </div>


            <!-- =================================
                 BIENVENIDA
            ================================== -->

            <div class="welcome">

                <h2>
                    ¡Bienvenido!
                </h2>

                <p>
                    Ingresa para continuar tu aventura tecnológica.
                </p>

            </div>


            <!-- =================================
                 FORMULARIO
            ================================== -->

            <form id="loginForm">


                <div class="input-group">

                    <label for="usuario">
                        USUARIO
                    </label>

                    <input
                        type="text"
                        id="usuario"
                        placeholder="Escribe tu usuario"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="password">
                        CONTRASEÑA
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Escribe tu contraseña"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-button"
                    id="loginButton"
                >

                    🚀 ENTRAR AL CAMPUS

                </button>


            </form>


            <!-- =================================
                 MENSAJE DE ERROR
            ================================== -->

            <div
                id="error"
                class="error"
            >

                ❌ Usuario o contraseña incorrectos.

            </div>


            <!-- =================================
                 FOOTER
            ================================== -->

            <div class="footer">

                ROBOT LAB © 2026

            </div>


        </div>

    </div>



    <!-- =========================================
         SUPABASE JAVASCRIPT
    ========================================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>


        // =========================================
        // CONFIGURACIÓN DE SUPABASE
        // =========================================

        const SUPABASE_URL =
            "https://bcfknbpkduiwgqymxkns.supabase.co";


        const SUPABASE_KEY =
            "sb_publishable_END5KZ8gA4e9YDpicG-aLw_aRaIzo7E";


        const supabase =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );



        // =========================================
        // ELEMENTOS DEL FORMULARIO
        // =========================================

        const loginForm =
            document.getElementById("loginForm");


        const usuarioInput =
            document.getElementById("usuario");


        const passwordInput =
            document.getElementById("password");


        const error =
            document.getElementById("error");


        const loginButton =
            document.getElementById("loginButton");



        // =========================================
        // LOGIN
        // =========================================

        loginForm.addEventListener(
            "submit",
            async function(event) {


                event.preventDefault();


                // Ocultar error anterior

                error.style.display =
                    "none";


                // =====================================
                // OBTENER DATOS
                // =====================================

                const usuario =
                    usuarioInput.value
                        .trim()
                        .toLowerCase();


                const password =
                    passwordInput.value;



                // =====================================
                // CORREO INTERNO
                // =====================================

                /*
                    El alumno escribe:

                    alumno04

                    Pero Supabase utiliza:

                    alumno04@citzapopan.com
                */

                const email =
                    usuario + "@citzapopan.com";



                // =====================================
                // CAMBIAR ESTADO DEL BOTÓN
                // =====================================

                loginButton.disabled =
                    true;

                loginButton.textContent =
                    "⏳ INICIANDO...";



                // =====================================
                // AUTENTICAR CON SUPABASE
                // =====================================

                const {
                    data,
                    error: loginError
                } =
                    await supabase.auth.signInWithPassword({

                        email: email,

                        password: password

                    });



                // =====================================
                // ERROR DE AUTENTICACIÓN
                // =====================================

                if (loginError) {


                    console.error(
                        "Error de login:",
                        loginError
                    );


                    error.textContent =
                        "❌ Usuario o contraseña incorrectos.";


                    error.style.display =
                        "block";


                    passwordInput.value =
                        "";


                    passwordInput.focus();


                    loginButton.disabled =
                        false;


                    loginButton.textContent =
                        "🚀 ENTRAR AL CAMPUS";


                    return;

                }



                // =====================================
                // BUSCAR ALUMNO
                // =====================================

                const {
                    data: alumno,
                    error: alumnoError
                } =
                    await supabase

                        .from("alumnos")

                        .select("*")

                        .eq(
                            "auth_id",
                            data.user.id
                        )

                        .single();



                // =====================================
                // PERFIL NO ENCONTRADO
                // =====================================

                if (
                    alumnoError ||
                    !alumno
                ) {


                    console.error(
                        "Error buscando alumno:",
                        alumnoError
                    );


                    error.textContent =
                        "❌ No se encontró el perfil del alumno.";


                    error.style.display =
                        "block";


                    await supabase.auth.signOut();


                    loginButton.disabled =
                        false;


                    loginButton.textContent =
                        "🚀 ENTRAR AL CAMPUS";


                    return;

                }



                // =====================================
                // GUARDAR USUARIO ACTIVO
                // =====================================

                sessionStorage.setItem(
                    "usuarioActivo",
                    alumno.usuario
                );



                // =====================================
                // REVISAR SI TIENE MASCOTA
                // =====================================

                if (
                    alumno.mascota
                ) {


                    // Ya tiene mascota

                    window.location.href =
                        "index.html";


                }

                else {


                    // Es su primer acceso

                    window.location.href =
                        "elegir-mascota.html";

                }


            }
        );


    </script>


</body>

</html>
