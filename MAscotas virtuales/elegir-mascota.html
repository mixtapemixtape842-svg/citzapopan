<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Robot Lab | Elige tu mascota</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #050505;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            padding: 40px 20px;
        }

        .glow {
            position: fixed;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: .12;
            pointer-events: none;
        }

        .glow-1 {
            background: #00eaff;
            top: -100px;
            left: -100px;
        }

        .glow-2 {
            background: #a855f7;
            right: -100px;
            bottom: -100px;
        }

        .container {
            width: 1100px;
            max-width: 100%;
            margin: auto;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            color: #00eaff;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 4px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: clamp(30px, 5vw, 48px);
            margin-bottom: 12px;
        }

        .subtitle {
            color: #777;
            font-size: 16px;
        }

        .student-name {
            color: #00eaff;
            font-weight: bold;
        }

        .mascotas {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 18px;
        }

        .mascota {
            background: rgba(15, 15, 15, .9);
            border: 1px solid #242424;
            border-radius: 20px;
            padding: 18px;
            cursor: pointer;
            text-align: center;
            transition: .25s;
        }

        .mascota:hover {
            transform: translateY(-8px);
            border-color: #00eaff;
            box-shadow: 0 0 25px rgba(0, 234, 255, .15);
        }

        .mascota.seleccionada {
            border-color: #00eaff;
            box-shadow:
                0 0 30px rgba(0, 234, 255, .25),
                inset 0 0 20px rgba(0, 234, 255, .05);
            transform: translateY(-8px);
        }

        .imagen-container {
            height: 190px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }

        .imagen-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: .25s;
        }

        .mascota:hover img {
            transform: scale(1.06);
        }

        .nombre {
            font-size: 18px;
            font-weight: bold;
        }

        .tipo {
            color: #666;
            font-size: 11px;
            margin-top: 5px;
            letter-spacing: 2px;
        }

        .check {
            display: none;
            margin-top: 12px;
            color: #00eaff;
            font-size: 12px;
            font-weight: bold;
        }

        .mascota.seleccionada .check {
            display: block;
        }

        .confirmar {
            display: block;
            width: 300px;
            max-width: 100%;
            margin: 40px auto 0;
            padding: 16px;

            background: #00eaff;
            color: #001014;

            border: none;
            border-radius: 10px;

            font-weight: 900;
            letter-spacing: 1px;
            cursor: pointer;

            opacity: .35;
            pointer-events: none;
            transition: .2s;
        }

        .confirmar.activo {
            opacity: 1;
            pointer-events: auto;
        }

        .confirmar.activo:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(0, 234, 255, .35);
        }

        @media (max-width: 900px) {
            .mascotas {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            .mascotas {
                grid-template-columns: 1fr;
            }

            .imagen-container {
                height: 230px;
            }
        }
    </style>
</head>

<body>

    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>

    <main class="container">

        <header class="header">

            <div class="logo">
                ROBOT LAB • CAMPUS VIRTUAL
            </div>

            <h1>
                Elige a tu compañero
            </h1>

            <p class="subtitle">
                ¡Hola, <span id="nombreAlumno" class="student-name"></span>!
                <br>
                Elige la mascota que te acompañará durante tu aventura.
            </p>

        </header>


        <section class="mascotas">

            <div class="mascota" data-mascota="robot">

                <div class="imagen-container">
                    <img src="Mascotas/robot.png" alt="Robot">
                </div>

                <div class="nombre">
                    Robot
                </div>

                <div class="tipo">
                    TECNOLÓGICO
                </div>

                <div class="check">
                    ✓ SELECCIONADO
                </div>

            </div>


            <div class="mascota" data-mascota="dinosaurio">

                <div class="imagen-container">
                    <img src="Mascotas/dinosaurio.png" alt="Dinosaurio">
                </div>

                <div class="nombre">
                    Dinosaurio
                </div>

                <div class="tipo">
                    EXPLORADOR
                </div>

                <div class="check">
                    ✓ SELECCIONADO
                </div>

            </div>


            <div class="mascota" data-mascota="gato">

                <div class="imagen-container">
                    <img src="Mascotas/gato.png" alt="Gato">
                </div>

                <div class="nombre">
                    Gato
                </div>

                <div class="tipo">
                    CURIOSO
                </div>

                <div class="check">
                    ✓ SELECCIONADO
                </div>

            </div>


            <div class="mascota" data-mascota="alien">

                <div class="imagen-container">
                    <img src="Mascotas/alien.png" alt="Alien">
                </div>

                <div class="nombre">
                    Alien
                </div>

                <div class="tipo">
                    INNOVADOR
                </div>

                <div class="check">
                    ✓ SELECCIONADO
                </div>

            </div>


            <div class="mascota" data-mascota="zorro">

                <div class="imagen-container">
                    <img src="Mascotas/zorro.png" alt="Zorro">
                </div>

                <div class="nombre">
                    Zorro
                </div>

                <div class="tipo">
                    ESTRATEGA
                </div>

                <div class="check">
                    ✓ SELECCIONADO
                </div>

            </div>

        </section>


        <button id="confirmar" class="confirmar">
            ELEGIR ESTA MASCOTA →
        </button>

    </main>


    <script src="alumnos.js"></script>

    <script>

        // ----------------------------------------
        // IDENTIFICAR ALUMNO
        // ----------------------------------------

        const usuarioActivo =
            sessionStorage.getItem("usuarioActivo");


        // Si no inició sesión, regresar al login

        if (!usuarioActivo || !alumnos[usuarioActivo]) {

            window.location.href = "login.html";

        }


        const alumno = alumnos[usuarioActivo];


        // Mostrar nombre

        document.getElementById("nombreAlumno").textContent =
            alumno.nombre;


        // ----------------------------------------
        // SELECCIÓN DE MASCOTA
        // ----------------------------------------

        const tarjetas =
            document.querySelectorAll(".mascota");

        const boton =
            document.getElementById("confirmar");

        let mascotaSeleccionada = null;


        tarjetas.forEach(tarjeta => {

            tarjeta.addEventListener("click", () => {

                // Quitar selección anterior

                tarjetas.forEach(t =>
                    t.classList.remove("seleccionada")
                );


                // Seleccionar nueva

                tarjeta.classList.add("seleccionada");


                mascotaSeleccionada =
                    tarjeta.dataset.mascota;


                boton.classList.add("activo");

            });

        });


        // ----------------------------------------
        // GUARDAR MASCOTA
        // ----------------------------------------

        boton.addEventListener("click", () => {

            if (!mascotaSeleccionada) return;


            /*
                Guardamos la elección en el alumno
            */

            alumno.mascota = mascotaSeleccionada;


            /*
                Guardamos los alumnos actualizados
                temporalmente en el navegador
            */

            localStorage.setItem(
                "alumnos",
                JSON.stringify(alumnos)
            );


            /*
                Guardamos también la mascota
                directamente asociada al usuario.
            */

            localStorage.setItem(
                "mascota_" + usuarioActivo,
                mascotaSeleccionada
            );


            /*
                Ir al dashboard
            */

            window.location.href = "index.html";

        });

    </script>

</body>
</html>
