<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Elige tu mascota | Robot Lab</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: white;

            background:
                radial-gradient(circle at top, #18204d 0%, #090b18 45%, #03040a 100%);

            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            text-align: center;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;

            background: linear-gradient(
                90deg,
                #00eaff,
                #9d4edd
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: #aaa;
            margin-bottom: 35px;
            font-size: 18px;
        }

        .mascotas {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 20px;
        }

        .mascota {
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(0,234,255,0.15);
            border-radius: 20px;

            padding: 20px;

            cursor: pointer;

            transition:
                transform .2s,
                border-color .2s,
                box-shadow .2s;

            backdrop-filter: blur(10px);
        }

        .mascota:hover {
            transform: translateY(-8px);

            border-color: #00eaff;

            box-shadow:
                0 0 25px rgba(0,234,255,.25);
        }

        .mascota img {
            width: 130px;
            height: 130px;

            object-fit: contain;

            margin-bottom: 10px;
        }

        .mascota h2 {
            margin: 5px 0;
            font-size: 20px;
        }

        .mensaje {
            margin-top: 25px;
            min-height: 30px;

            font-size: 16px;
            font-weight: bold;
        }

        .error {
            color: #ff4d6d;
        }

        .exito {
            color: #00ff9d;
        }

        .cargando {
            color: #00eaff;
        }

        .volver {
            display: inline-block;
            margin-top: 25px;

            color: #aaa;
            text-decoration: none;
        }

        .volver:hover {
            color: white;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🐾 ELIGE TU MASCOTA</h1>

    <div class="subtitle">
        Esta mascota te acompañará durante tu aventura en Robot Lab
    </div>

    <div class="mascotas">

        <div class="mascota" data-mascota="robot">
            <img src="Mascotas/robot.png" alt="Robot">
            <h2>🤖 Robot</h2>
        </div>

        <div class="mascota" data-mascota="dinosaurio">
            <img src="Mascotas/dinosaurio.png" alt="Dinosaurio">
            <h2>🦖 Dinosaurio</h2>
        </div>

        <div class="mascota" data-mascota="gato">
            <img src="Mascotas/gato.png" alt="Gato">
            <h2>🐱 Gato</h2>
        </div>

        <div class="mascota" data-mascota="alien">
            <img src="Mascotas/alien.png" alt="Alien">
            <h2>👽 Alien</h2>
        </div>

        <div class="mascota" data-mascota="zorro">
            <img src="Mascotas/zorro.png" alt="Zorro">
            <h2>🦊 Zorro</h2>
        </div>

    </div>

    <div id="mensaje" class="mensaje"></div>

    <a href="login.html" class="volver">
        ← Volver al inicio de sesión
    </a>

</div>


<script>

const SUPABASE_URL =
    "https://bcfknbpkduiwgqymxkns.supabase.co";

const SUPABASE_KEY =
    "TU_CLAVE_PUBLICABLE";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const mensaje =
    document.getElementById("mensaje");


async function iniciar() {

    mensaje.textContent = "Verificando sesión...";
    mensaje.className = "mensaje cargando";

    const {
        data,
        error
    } = await supabaseClient.auth.getSession();


    if (error) {

        console.error(error);

        mensaje.textContent =
            "❌ No se pudo verificar la sesión.";

        mensaje.className = "mensaje error";

        return;
    }


    if (!data.session) {

        window.location.href =
            "login.html";

        return;
    }


    // Verificar que el alumno existe
    const usuarioAuth =
        data.session.user;


    const {
        data: alumno,
        error: alumnoError
    } = await supabaseClient
        .from("alumnos")
        .select("id, usuario, nombre, mascota")
        .eq("auth_id", usuarioAuth.id)
        .maybeSingle();


    if (alumnoError) {

        console.error(
            "Error buscando alumno:",
            alumnoError
        );

        mensaje.textContent =
            "❌ No se pudo encontrar tu alumno.";

        mensaje.className =
            "mensaje error";

        return;
    }


    if (!alumno) {

        mensaje.textContent =
            "❌ Tu cuenta no está vinculada a un alumno.";

        mensaje.className =
            "mensaje error";

        return;
    }


    // Si ya tiene mascota, no necesita elegir otra
    if (
        alumno.mascota !== null &&
        alumno.mascota !== ""
    ) {

        window.location.href =
            "index.html";

        return;
    }


    mensaje.textContent =
        "Selecciona una mascota para comenzar.";

    mensaje.className =
        "mensaje";
}


async function elegirMascota(mascotaSeleccionada) {

    mensaje.textContent =
        "⏳ Guardando tu mascota...";

    mensaje.className =
        "mensaje cargando";


    // Verificar sesión
    const {
        data: sessionData,
        error: sessionError
    } = await supabaseClient.auth.getSession();


    if (
        sessionError ||
        !sessionData.session
    ) {

        mensaje.textContent =
            "❌ Tu sesión expiró. Regresa al login.";

        mensaje.className =
            "mensaje error";

        return;
    }


    console.log(
        "Usuario autenticado:",
        sessionData.session.user.id
    );

    console.log(
        "Mascota seleccionada:",
        mascotaSeleccionada
    );


    // GUARDAR MASCOTA MEDIANTE RPC
    const {
        error
    } = await supabaseClient.rpc(
        "elegir_mascota",
        {
            mascota_elegida:
                mascotaSeleccionada
        }
    );


    if (error) {

        console.error(
            "ERROR GUARDANDO MASCOTA:",
            error
        );

        mensaje.textContent =
            "❌ La mascota no se pudo guardar correctamente.";

        mensaje.className =
            "mensaje error";

        return;
    }


    // Confirmar que realmente se guardó
    const {
        data: alumnoConfirmado,
        error: confirmError
    } = await supabaseClient
        .from("alumnos")
        .select("mascota")
        .eq(
            "auth_id",
            sessionData.session.user.id
        )
        .single();


    if (
        confirmError ||
        !alumnoConfirmado ||
        alumnoConfirmado.mascota !== mascotaSeleccionada
    ) {

        console.error(
            "La mascota no coincide después de guardar:",
            confirmError,
            alumnoConfirmado
        );

        mensaje.textContent =
            "❌ La mascota no se pudo guardar correctamente.";

        mensaje.className =
            "mensaje error";

        return;
    }


    mensaje.textContent =
        "✅ ¡Mascota guardada! Entrando al campus...";

    mensaje.className =
        "mensaje exito";


    setTimeout(() => {

        window.location.href =
            "index.html";

    }, 1000);
}


// Activar botones
document
    .querySelectorAll(".mascota")
    .forEach(elemento => {

        elemento.addEventListener(
            "click",
            () => {

                const mascota =
                    elemento.dataset.mascota;

                elegirMascota(mascota);

            }
        );

    });


iniciar();

</script>

</body>
</html>
