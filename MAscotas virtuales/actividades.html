<style>

/* =========================================

========================================= */

/* =========================================

========================================= */

<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://bcfknbpkduiwgqymxkns.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_END5KZ8gA4e9YDpicG-aLw_aRaIzo7E";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   VARIABLES
========================================= */

let alumnoActual = null;

let actividadesAlumno = [];

let filtroActual = "todas";


/* =========================================
   ESCAPAR HTML
========================================= */

function escaparHTML(texto) {

    if (
        texto === null ||
        texto === undefined
    ) {

        return "";

    }


    return String(texto)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================
   FORMATEAR FECHA
========================================= */

function formatearFecha(fecha) {

    if (!fecha) {

        return "Sin fecha";

    }


    const fechaObj =
        new Date(fecha);


    if (
        isNaN(
            fechaObj.getTime()
        )
    ) {

        return "Sin fecha";

    }


    return fechaObj.toLocaleDateString(
        "es-MX",
        {
            day: "2-digit",
            month: "short",
            year: "numeric"
        }
    );

}


/* =========================================
   FORMATEAR TIPO
========================================= */

function formatearTipo(tipo) {

    if (!tipo) {

        return "ACTIVIDAD";

    }


    const tipos = {

        enlace: "ENLACE",

        practica: "PRÁCTICA",

        proyecto: "PROYECTO",

        quiz: "QUIZ",

        video: "VIDEO",

        lectura: "LECTURA",

        otro: "ACTIVIDAD"

    };


    return (
        tipos[tipo]
        ||
        tipo.toUpperCase()
    );

}


/* =========================================
   INICIAR PÁGINA
========================================= */

async function iniciar() {

    try {

        const {
            data: sessionData,
            error: sessionError
        } =
            await supabaseClient
                .auth
                .getSession();


        if (sessionError) {

            console.error(
                "Error de sesión:",
                sessionError
            );

            window.location.href =
                "login.html";

            return;

        }


        if (
            !sessionData.session
        ) {

            window.location.href =
                "login.html";

            return;

        }


        const usuarioAuth =
            sessionData.session.user;


        /* =========================================
           BUSCAR ALUMNO
        ========================================= */

        const {
            data: alumno,
            error: alumnoError
        } =
            await supabaseClient
                .from("alumnos")
                .select(`
                    id,
                    nombre,
                    usuario
                `)
                .eq(
                    "auth_id",
                    usuarioAuth.id
                )
                .maybeSingle();


        if (alumnoError) {

            console.error(
                "Error alumno:",
                alumnoError
            );

            mostrarError(
                "No se pudieron cargar tus datos."
            );

            return;

        }


        if (!alumno) {

            await supabaseClient
                .auth
                .signOut();

            window.location.href =
                "login.html";

            return;

        }


        alumnoActual =
            alumno;


        document.getElementById(
            "mensajeBienvenida"
        ).textContent =
            `Hola ${alumno.nombre}. Aquí encontrarás todas las actividades que tu profesor te ha asignado.`;


        await cargarActividades();

    }

    catch (error) {

        console.error(
            "Error iniciando página:",
            error
        );

        mostrarError(
            "Ocurrió un error inesperado."
        );

    }

}


/* =========================================
   CARGAR ACTIVIDADES
========================================= */

async function cargarActividades() {

    if (!alumnoActual) {

        return;

    }


    const contenedor =
        document.getElementById(
            "activitiesGrid"
        );


    contenedor.innerHTML = `

        <div class="loading">

            <div class="loading-icon">
                🧩
            </div>

            Cargando actividades...

        </div>

    `;


    try {

        /* =========================================
           1. ASIGNACIONES
        ========================================= */

        const {
            data: asignaciones,
            error: asignacionesError
        } =
            await supabaseClient
                .from("actividad_alumnos")
                .select(`
                    id,
                    actividad_id,
                    estado,
                    calificacion,
                    completada_at,
                    created_at
                `)
                .eq(
                    "alumno_id",
                    alumnoActual.id
                )
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


        if (asignacionesError) {

            console.error(
                "Error asignaciones:",
                asignacionesError
            );

            mostrarError(
                "No se pudieron cargar tus actividades."
            );

            return;

        }


        const listaAsignaciones =
            asignaciones || [];


        /* =========================================
           SIN ACTIVIDADES
        ========================================= */

        if (
            listaAsignaciones.length === 0
        ) {

            actividadesAlumno = [];

            actualizarResumen();

            mostrarVacio();

            return;

        }


        /* =========================================
           2. IDS
        ========================================= */

        const ids =
            listaAsignaciones
                .map(
                    asignacion =>
                        asignacion.actividad_id
                )
                .filter(Boolean);


        if (ids.length === 0) {

            actividadesAlumno = [];

            actualizarResumen();

            mostrarVacio();

            return;

        }


        /* =========================================
           3. ACTIVIDADES
        ========================================= */

        const {
            data: actividades,
            error: actividadesError
        } =
            await supabaseClient
                .from("actividades")
                .select(`
                    id,
                    titulo,
                    descripcion,
                    tipo,
                    enlace,
                    imagen_url,
                    puntos,
                    fecha_limite,
                    activo,
                    created_at
                `)
                .in(
                    "id",
                    ids
                );


        if (actividadesError) {

            console.error(
                "Error actividades:",
                actividadesError
            );

            mostrarError(
                "No se pudo cargar la información de las actividades."
            );

            return;

        }


        const listaActividades =
            actividades || [];


        /* =========================================
           4. UNIR DATOS
        ========================================= */

        actividadesAlumno =
            listaActividades.map(
                actividad => {

                    const asignacion =
                        listaAsignaciones.find(
                            item =>
                                Number(
                                    item.actividad_id
                                ) ===
                                Number(
                                    actividad.id
                                )
                        );


                    return {

                        ...actividad,

                        asignacion_id:
                            asignacion?.id,

                        estado:
                            asignacion?.estado
                            ||
                            "pendiente",

                        calificacion:
                            asignacion?.calificacion,

                        completada_at:
                            asignacion?.completada_at

                    };

                }
            );


        actualizarResumen();

        mostrarActividades();

    }

    catch (error) {

        console.error(
            "Error cargando actividades:",
            error
        );

        mostrarError(
            "Ocurrió un error al consultar las actividades."
        );

    }

}


/* =========================================
   RESUMEN
========================================= */

function actualizarResumen() {

    const total =
        actividadesAlumno.length;


    const pendientes =
        actividadesAlumno.filter(
            actividad =>
                actividad.estado !==
                "completada"
        ).length;


    const completadas =
        actividadesAlumno.filter(
            actividad =>
                actividad.estado ===
                "completada"
        ).length;


    document.getElementById(
        "totalActividades"
    ).textContent =
        total;


    document.getElementById(
        "pendientesActividades"
    ).textContent =
        pendientes;


    document.getElementById(
        "completadasActividades"
    ).textContent =
        completadas;

}


/* =========================================
   MOSTRAR ACTIVIDADES
========================================= */

function mostrarActividades() {

    const contenedor =
        document.getElementById(
            "activitiesGrid"
        );


    let lista =
        actividadesAlumno;


    if (
        filtroActual ===
        "pendiente"
    ) {

        lista =
            actividadesAlumno.filter(
                actividad =>
                    actividad.estado !==
                    "completada"
            );

    }


    if (
        filtroActual ===
        "completada"
    ) {

        lista =
            actividadesAlumno.filter(
                actividad =>
                    actividad.estado ===
                    "completada"
            );

    }


    if (lista.length === 0) {

        mostrarVacio(
            filtroActual === "pendiente"
                ? "No tienes actividades pendientes."
                : filtroActual === "completada"
                    ? "Todavía no has completado actividades."
                    : "No tienes actividades asignadas."
        );

        return;

    }


    contenedor.innerHTML =
        lista
            .map(
                actividad =>
                    crearTarjeta(
                        actividad
                    )
            )
            .join("");

}


/* =========================================
   CREAR TARJETA
========================================= */

function crearTarjeta(
    actividad
) {

    const completada =
        actividad.estado ===
        "completada";


    let estadoClase =
        "pending";


    let estadoTexto =
        "PENDIENTE";


    if (completada) {

        estadoClase =
            "completed";

        estadoTexto =
            "✓ COMPLETADA";

    }


    if (
        actividad.estado ===
        "en_progreso"
    ) {

        estadoClase =
            "progress";

        estadoTexto =
            "EN PROGRESO";

    }


    const titulo =
        escaparHTML(
            actividad.titulo
            ||
            "Actividad"
        );


    const descripcion =
        escaparHTML(
            actividad.descripcion
            ||
            "Sin descripción."
        );


    const tipo =
        escaparHTML(
            formatearTipo(
                actividad.tipo
            )
        );


    const puntos =
        Number(
            actividad.puntos
        ) || 0;


    const fecha =
        formatearFecha(
            actividad.fecha_limite
        );


    let enlace =
        actividad.enlace
        ||
        "#";


    /*
        Solamente permitimos http/https
        para evitar enlaces javascript:
    */

    if (
        !/^https?:\/\//i.test(
            enlace
        )
    ) {

        enlace = "#";

    }


    const imagen =
        actividad.imagen_url;


    const imagenHTML =
        imagen
        ? `

            <img
                class="activity-image visible"
                src="${escaparHTML(imagen)}"
                alt="Imagen de actividad"
                onerror="this.style.display='none';"
            >

        `
        : "";


    let botonTexto =
        "COMENZAR ACTIVIDAD →";


    if (completada) {

        botonTexto =
            "VER ACTIVIDAD →";

    }


    return `

        <article
            class="activity-card"
        >

            ${imagenHTML}


            <div class="activity-content">


                <div class="activity-top">

                    <span class="activity-type">

                        🧩 ${tipo}

                    </span>


                    <span
                        class="status ${estadoClase}"
                    >

                        ${estadoTexto}

                    </span>

                </div>


                <h2>
                    ${titulo}
                </h2>


                <p
                    class="activity-description"
                >
                    ${descripcion}
                </p>


                <div class="activity-info">


                    <div class="info-box">

                        <span class="info-label">
                            Fecha límite
                        </span>

                        <span class="info-value">
                            📅 ${fecha}
                        </span>

                    </div>


                    <div class="info-box">

                        <span class="info-label">
                            Recompensa
                        </span>

                        <span
                            class="info-value points"
                        >
                            +${puntos} XP
                        </span>

                    </div>


                </div>


                <a
                    href="${escaparHTML(enlace)}"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="activity-button"
                    onclick="marcarVista(${actividad.asignacion_id})"
                >

                    ${botonTexto}

                </a>


            </div>

        </article>

    `;

}


/* =========================================
   MARCAR COMO VISTA
========================================= */

async function marcarVista(
    asignacionId
) {

    if (!asignacionId) {

        return;

    }


    /*
        Por ahora NO cambiamos el estado.

        La actividad seguirá apareciendo
        como pendiente hasta que el profesor
        o el sistema la marque como completada.

        Esta función queda preparada para
        posteriormente implementar:

        pendiente
        ↓
        vista
        ↓
        en_progreso
        ↓
        completada
    */

    console.log(
        "Actividad abierta:",
        asignacionId
    );

}


/* =========================================
   FILTROS
========================================= */

function filtrarActividades(
    filtro,
    boton
) {

    filtroActual =
        filtro;


    document
        .querySelectorAll(
            ".filter-button"
        )
        .forEach(
            elemento =>
                elemento.classList.remove(
                    "active"
                )
        );


    boton.classList.add(
        "active"
    );


    mostrarActividades();

}


/* =========================================
   ESTADO VACÍO
========================================= */

function mostrarVacio(
    mensaje =
        "No tienes actividades asignadas."
) {

    const contenedor =
        document.getElementById(
            "activitiesGrid"
        );


    contenedor.innerHTML = `

        <div class="empty">

            <div class="empty-icon">
                🤖
            </div>

            <h2>
                ¡Todo al día!
            </h2>

            <p>
                ${escaparHTML(mensaje)}
            </p>

        </div>

    `;

}


/* =========================================
   ERROR
========================================= */

function mostrarError(
    mensaje
) {

    const contenedor =
        document.getElementById(
            "activitiesGrid"
        );


    contenedor.innerHTML = `

        <div class="error-box">

            <strong>
                ⚠️ No se pudieron cargar las actividades
            </strong>

            <p>
                ${escaparHTML(mensaje)}
            </p>

        </div>

    `;

}


/* =========================================
   CERRAR SESIÓN
========================================= */

async function cerrarSesion() {

    await supabaseClient
        .auth
        .signOut();


    sessionStorage.clear();


    window.location.href =
        "login.html";

}


/* =========================================
   INICIAR
========================================= */

iniciar();

</script>
